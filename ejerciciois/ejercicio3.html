
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 3</title>
</head>
<body>

    <h1>Mostrar un texto</h1>

    <input type="text" id="idTexto">

    <button onclick="mostrarTexto()">
        Mostrar texto
    </button>

    <div id="resultado"></div>

    <script>
        function mostrarTexto() {
            texto = document.getElementById("idTexto").value;

            document.getElementById("resultado").innerHTML = texto;
        }
    </script>

</body>
</html>
